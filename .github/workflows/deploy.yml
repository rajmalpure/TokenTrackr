name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/attendance-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update backend image to new SHA
        run: |
          kubectl set image deployment/backend-deployment \
            backend=${{ secrets.DOCKER_USERNAME }}/attendance-backend:${{ github.sha }}

      - name: Update frontend image to new SHA
        run: |
          kubectl set image deployment/frontend-deployment \
            frontend=${{ secrets.DOCKER_USERNAME }}/attendance-frontend:${{ github.sha }}

      - name: Rollout restart backend deployment
        run: kubectl rollout restart deployment/backend-deployment

      - name: Rollout restart frontend deployment
        run: kubectl rollout restart deployment/frontend-deployment

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend-deployment --timeout=120s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend-deployment --timeout=120s
